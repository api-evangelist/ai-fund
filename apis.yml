aid: ai-fund
name: AI Fund
description: >-
  AI Fund is a venture studio founded by Andrew Ng that co-founds and scales
  AI-powered companies alongside entrepreneurs, venture funds, and corporate
  partners. Backed by more than $370 million from investors including Sequoia
  Capital, NEA, Nikkei, and AES, it validates, builds, and scales ventures that
  tackle real-world problems across emergency response, retail, supply chain,
  government services, and enterprise productivity. Portfolio companies include
  Workera, Factored, Workhelix, Profitmind, and IrisGo. AI Fund was added to the
  API Evangelist network as a portfolio company of Greylock.
